<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Video Katri – Free Video Cutter + Auto Caption</title>
<style>
:root{--bg:#f3f1ea;--ink:#1d2320;--mut:#5d675f;--card:#fff;--line:#d6d2c4;--acc:#0f6b4f;--accink:#fff;--warn:#b3261e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a17;--ink:#e9efe9;--mut:#9aa89e;--card:#1d2621;--line:#33413a;--acc:#4cc79a;--accink:#06231a;--warn:#ff8a80}}
:root[data-theme="dark"]{--bg:#141a17;--ink:#e9efe9;--mut:#9aa89e;--card:#1d2621;--line:#33413a;--acc:#4cc79a;--accink:#06231a;--warn:#ff8a80}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Hind","Segoe UI",system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 40px}
h1{font:700 2rem/1.15 "Georgia","Times New Roman",serif;margin:8px 0 4px}
p.sub{color:var(--mut);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.drop{display:block;border:2px dashed var(--line);border-radius:10px;padding:28px 12px;text-align:center;cursor:pointer;font-weight:600}
.drop:focus-within,.drop:hover{border-color:var(--acc)}
input[type=file]{position:absolute;opacity:0;width:1px;height:1px}
video{width:100%;max-height:50vh;background:#000;border-radius:8px;display:block}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
label{display:block;font-weight:600;font-size:.9rem;margin-bottom:4px}
input[type=number],select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.chk{display:flex;gap:8px;align-items:center;margin:0}
.chk input{width:20px;height:20px}
button{font:inherit;font-weight:600;padding:10px 14px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
button.main{background:var(--acc);color:var(--accink);border-color:var(--acc);width:100%;margin-top:14px;padding:13px}
button:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.set{margin-top:6px;width:100%;font-size:.85rem}
.info{margin:12px 0 0;color:var(--mut);font-size:.92rem}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:12px;display:none}
.bar i{display:block;height:100%;width:0;background:var(--acc)}
.err{color:var(--warn);font-weight:600}
a.dl{display:inline-block;margin-top:12px;padding:12px 16px;background:var(--acc);color:var(--accink);border-radius:8px;font-weight:700;text-decoration:none}
canvas{display:none}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<h1>Video Katri</h1>
<p class="sub">Lamba video chuniye, start aur end time daaliye, aur Hindi ya English auto caption ke saath chhota video download kijiye. Free hai, video upload nahi hota.</p>

<div class="card">
<label class="drop" for="f">Video chuniye (tap karke select karo)</label>
<input type="file" id="f" accept="video/*">
</div>

<div class="card" id="ed" hidden>
<video id="v" controls playsinline></video>
<div class="row">
<div><label for="s">Start (second)</label><input type="number" id="s" min="0" step="0.1" value="0">
<button class="set" id="ss" type="button">Abhi ka time = Start</button></div>
<div><label for="e">End (second)</label><input type="number" id="e" min="0" step="0.1" value="10">
<button class="set" id="se" type="button">Abhi ka time = End</button></div>
</div>
<div class="row">
<div><label class="chk" for="cc"><input type="checkbox" id="cc" checked> Auto caption lagao</label></div>
<div><label for="lg">Video ki bhasha</label>
<select id="lg"><option value="hi-IN">Hindi (हिन्दी)</option><option value="en-IN">English</option></select></div>
</div>
<p class="info" id="inf"></p>
<button class="main" id="go" type="button">Short video banao</button>
<div class="bar" id="bar"><i id="fill"></i></div>
<p class="info" id="msg" role="status"></p>
<canvas id="cv"></canvas>
<div id="out" hidden>
<video id="r" controls playsinline></video>
<a class="dl" id="dl" download="short-video.webm">Short video download karo</a>
</div>
</div>
</main>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
var f=$("f"),v=$("v"),s=$("s"),e=$("e"),go=$("go"),msg=$("msg"),inf=$("inf"),bar=$("bar"),fill=$("fill"),out=$("out"),r=$("r"),dl=$("dl"),cv=$("cv"),ctx=cv.getContext("2d");
var url=null,busy=false,live=false,txt="",last=0;
function fmt(t){t=Math.max(0,t);var m=Math.floor(t/60),x=(t%60).toFixed(1);return m+":"+(x<10?"0":"")+x}
function upd(){var d=(parseFloat(e.value)||0)-(parseFloat(s.value)||0);inf.textContent="Total length: "+fmt(v.duration||0)+"  |  Cut length: "+(d>0?fmt(d):"galat time")}
f.addEventListener("change",function(){
 var file=f.files[0];if(!file)return;
 if(url)URL.revokeObjectURL(url);
 url=URL.createObjectURL(file);v.src=url;out.hidden=true;msg.textContent="";$("ed").hidden=false;
});
v.addEventListener("loadedmetadata",function(){s.value=0;e.value=Math.min(30,v.duration).toFixed(1);s.max=e.max=v.duration;upd()});
v.addEventListener("error",function(){msg.innerHTML='<span class="err">Ye video format browser me nahi chal raha. MP4 ya WebM try karo.</span>'});
[s,e].forEach(function(x){x.addEventListener("input",upd)});
$("ss").onclick=function(){s.value=v.currentTime.toFixed(1);upd()};
$("se").onclick=function(){e.value=v.currentTime.toFixed(1);upd()};

function pickType(){
 var t=["video/webm;codecs=vp9,opus","video/webm;codecs=vp8,opus","video/webm","video/mp4"];
 for(var i=0;i<t.length;i++){if(MediaRecorder.isTypeSupported(t[i]))return t[i]}
 return "";
}
function fail(t){live=false;msg.innerHTML='<span class="err">'+t+'</span>';bar.style.display="none";go.disabled=false;busy=false}

function drawCap(){
 if(!txt||performance.now()-last>3000)return;
 var fs=Math.max(18,Math.round(cv.width/22));
 ctx.font="700 "+fs+"px 'Noto Sans Devanagari','Mangal','Segoe UI',sans-serif";
 ctx.textAlign="center";ctx.textBaseline="bottom";ctx.lineJoin="round";
 var words=txt.split(/\s+/).slice(-10),lines=[],cur="",max=cv.width*0.9;
 words.forEach(function(w){var t=cur?cur+" "+w:w;if(ctx.measureText(t).width>max&&cur){lines.push(cur);cur=w}else cur=t});
 if(cur)lines.push(cur);
 lines=lines.slice(-2);
 var y=cv.height-fs*0.7-(lines.length-1)*fs*1.2;
 lines.forEach(function(l,i){
  var yy=y+i*fs*1.2;
  ctx.lineWidth=fs/5;ctx.strokeStyle="#000";ctx.strokeText(l,cv.width/2,yy);
  ctx.fillStyle="#fff";ctx.fillText(l,cv.width/2,yy);
 });
}

go.onclick=function(){
 if(busy)return;
 var a=parseFloat(s.value),b=parseFloat(e.value);
 if(!(b>a)||a<0||b>v.duration+0.1){return fail("End time Start se bada hona chahiye, aur video ki length ke andar.")}
 var cap=v.captureStream||v.mozCaptureStream;
 if(!cap||!window.MediaRecorder||!cv.captureStream){return fail("Is browser me cutting support nahi hai. Chrome ya Edge use karo.")}
 var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 var wantCap=$("cc").checked,sr=null,note="";
 if(wantCap&&!SR){wantCap=false;note=" (Is browser me auto caption support nahi hai, Chrome use karo.)"}
 var type=pickType();
 busy=true;go.disabled=true;out.hidden=true;bar.style.display="block";fill.style.width="0";txt="";
 msg.textContent=(wantCap?"Caption ke liye mic permission Allow karo. ":"")+"Video chal raha hai aur record ho raha hai, beech me roko mat aur tab band mat karo."+note;
 var chunks=[],rec;
 var onSeek=function(){
  v.removeEventListener("seeked",onSeek);
  try{
   cv.width=Math.min(v.videoWidth||640,854);cv.height=Math.round(cv.width*(v.videoHeight||360)/(v.videoWidth||640));
   var cs=cv.captureStream(30);
   cap.call(v).getAudioTracks().forEach(function(t){cs.addTrack(t)});
   rec=type?new MediaRecorder(cs,{mimeType:type}):new MediaRecorder(cs);
  }catch(err){return fail("Recording shuru nahi ho paayi: "+err.message)}
  rec.ondataavailable=function(ev){if(ev.data&&ev.data.size)chunks.push(ev.data)};
  rec.onstop=function(){
   var blob=new Blob(chunks,{type:rec.mimeType||"video/webm"});
   var u=URL.createObjectURL(blob);
   r.src=u;dl.href=u;dl.download="short-video."+(blob.type.indexOf("mp4")>-1?"mp4":"webm");
   out.hidden=false;bar.style.display="none";go.disabled=false;busy=false;
   msg.textContent="Ho gaya! Neeche preview dekho aur download karo.";
  };
  if(wantCap){
   sr=new SR();sr.lang=$("lg").value;sr.continuous=true;sr.interimResults=true;
   sr.onresult=function(ev){var t="";for(var i=ev.resultIndex;i<ev.results.length;i++)t+=ev.results[i][0].transcript;txt=t.trim();last=performance.now()};
   sr.onend=function(){if(live){try{sr.start()}catch(x){}}};
   sr.onerror=function(ev){if(ev.error==="not-allowed"||ev.error==="service-not-allowed"){msg.innerHTML='<span class="err">Mic permission nahi mili, isliye caption nahi lagega.</span>';live&&(sr.onend=null)}};
   try{sr.start()}catch(x){}
  }
  live=true;rec.start(250);
  var p=v.play();if(p&&p.catch)p.catch(function(){live=false;rec.stop();fail("Browser ne play rokk diya. Ek baar video par tap karke dobara try karo.")});
  var loop=function(){
   if(!live)return;
   ctx.drawImage(v,0,0,cv.width,cv.height);drawCap();
   fill.style.width=Math.min(100,Math.max(0,(v.currentTime-a)/(b-a)*100))+"%";
   if(v.currentTime>=b||v.ended){live=false;v.pause();if(sr)try{sr.stop()}catch(x){}if(rec.state!=="inactive")rec.stop();return}
   requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
 };
 v.pause();v.addEventListener("seeked",onSeek);v.currentTime=a;
};
})();
</script>
</body>
</html>
